spring:
  application:
    name: media-service
  servlet:
    multipart:
      # Ảnh tối đa 10 MB (UploadPolicy); request có thêm vài trường nhỏ.
      max-file-size: 10MB
      max-request-size: 11MB
  profiles:
    default: uat
  flyway:
    table: flyway_history_media
    # Các service dùng chung một database. Lần đầu service này chạy, database đã có bảng
    # của service khác, nên Flyway phải đặt mốc 0 rồi mới chạy V1 của riêng nó.
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8083

media:
  storage:
    # Thư mục chứa ảnh; tương đối thì tính từ thư mục chạy service.
    root: data/media

---
spring:
  config:
    activate:
      on-profile: prod
  main:
    banner-mode: "off"
