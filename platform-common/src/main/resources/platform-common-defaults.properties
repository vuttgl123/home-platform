# Defaults for every service. Override them in the service's own application.yaml.
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=5m

# Mọi thời điểm trong database là giờ UTC. Hai thuộc tính của MySQL Connector/J dưới đây cho
# driver và phiên làm việc dùng UTC, nên SQL viết tay truyền thẳng Instant hay dùng NOW() đều
# khớp với dữ liệu đã lưu, bất kể múi giờ của máy chạy hay của server MySQL.
spring.datasource.hikari.data-source-properties.connectionTimeZone=UTC
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true
